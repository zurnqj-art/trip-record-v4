<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出差記錄 V5</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:12px}.wrap{max-width:1000px;margin:auto;background:#fff;padding:15px;border-radius:12px}h2{text-align:center;color:#0078d4}input,button{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}button{border:0;border-radius:8px;background:#0078d4;color:#fff}.danger{background:#d83b01}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}th,td{border:1px solid #ddd;padding:6px}th{background:#0078d4;color:#fff}.row{overflow:auto}</style></head><body><div class="wrap"><h2>出差記錄 V5</h2><input id="date" type="date"><input id="customer" placeholder="客戶名稱"><input id="reason" placeholder="出差事由"><input id="start" placeholder="出發地"><input id="dest" placeholder="目的地"><input id="distance" type="number" placeholder="里程數(公里)"><input id="parking" type="number" placeholder="停車費"><input id="rate" type="number" value="5" placeholder="每公里油資"><button id="addBtn">新增紀錄</button><button id="csvBtn">匯出CSV</button><button id="jsonBtn">匯出JSON</button><input id="importFile" type="file"><div class="row"><table><thead><tr><th>日期</th><th>客戶</th><th>事由</th><th>出發地</th><th>目的地</th><th>合計</th><th>刪除</th></tr></thead><tbody id="tbody"></tbody></table></div><h3>總金額：NT$ <span id="total">0</span></h3></div><script>(function(){const KEY='trip_v5';let records=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().split('T')[0];function save(){localStorage.setItem(KEY,JSON.stringify(records));render();}function render(){let h='',sum=0;records.forEach((r,i)=>{const total=(r.distance*r.rate)+r.parking;sum+=total;h+=`<tr><td>${r.date}</td><td>${r.customer}</td><td>${r.reason}</td><td>${r.start}</td><td>${r.dest}</td><td>${total}</td><td><button class="danger" data-i="${i}">刪除</button></td></tr>`});$('tbody').innerHTML=h;$('total').textContent=sum;document.querySelectorAll('.danger').forEach(b=>b.onclick=()=>{records.splice(Number(b.dataset.i),1);save();});}function addRecord(){const r={date:$('date').value,customer:$('customer').value.trim(),reason:$('reason').value.trim(),start:$('start').value.trim(),dest:$('dest').value.trim(),distance:Number($('distance').value||0),parking:Number($('parking').value||0),rate:Number($('rate').value||5)};if(!r.customer||!r.reason){alert('請輸入客戶名稱與出差事由');return;}records.push(r);save();['customer','reason','start','dest','distance','parking'].forEach(id=>$(id).value='');}function exportJSON(){const b=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trip-backup.json';a.click();}function exportCSV(){let csv='日期,客戶,事由,出發地,目的地,里程數,停車費
';records.forEach(r=>csv+=`${r.date},${r.customer},${r.reason},${r.start},${r.dest},${r.distance},${r.parking}
`);const b=new Blob(['﻿'+csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trip.csv';a.click();}function importJSON(e){const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=x=>{records=JSON.parse(x.target.result);save();};fr.readAsText(f);}$('addBtn').addEventListener('click',addRecord);$('jsonBtn').addEventListener('click',exportJSON);$('csvBtn').addEventListener('click',exportCSV);$('importFile').addEventListener('change',importJSON);render();})();</script></body></html>
